name: Bug report
description: Report a reproducible defect that does not contain sensitive security information.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include real reports, personal data, credentials, tracking codes, or vulnerability details. Use the Security tab for private vulnerability reports.
  - type: textarea
    id: outcome
    attributes:
      label: Expected outcome
      description: What should a user have been able to do?
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed outcome
      description: What happened instead? Use synthetic data only.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide the smallest deterministic sequence, route, locale, and synthetic inputs.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Public project experience
        - Safe reporting or tracking
        - Reviewer workflow
        - Source Scout or grounded AI
        - Localisation or accessibility
        - Build, test, or deployment
        - Documentation
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Commit, browser/device, operating system, and local or hosted environment.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed personal data, secrets, real allegations, tracking codes, and private evidence.
          required: true
        - label: This is not a vulnerability report; security-sensitive details will be reported privately.
          required: true
