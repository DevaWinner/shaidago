name: frontend

on:
  pull_request:
    paths:
      - ".github/workflows/frontend.yml"
      - ".nvmrc"
      - "Makefile"
      - "apps/web/**"
      - "contracts/openapi.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "scripts/render_frontend_contract.py"
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    name: Deterministic web foundation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/validate_frontend_workflow.py --self-test
      # pnpm must exist before setup-node can resolve its store for `cache: pnpm`.
      - run: corepack enable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: make web-format-check
      - run: make web-lint
      - run: make web-typecheck
      - run: make web-unit
      - run: make web-component
      - run: make web-contract
      # Builds with synthetic private canaries and inspects client chunks; it never contacts the
      # private API or uses a real credential.
      - run: make web-boundary
      - run: pnpm audit --prod --audit-level high

  browser:
    name: Standalone browser and accessibility checks
    needs: foundation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # pnpm must exist before setup-node can resolve its store for `cache: pnpm`.
      - run: corepack enable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/web exec playwright install --with-deps chromium webkit
      - run: make web-e2e
      - run: make web-a11y
      # No traces, screenshots, videos, coverage, or Playwright reports are uploaded. Browser
      # tests use synthetic values only and must not make private artifacts available to a PR.

  frontend-required:
    name: Frontend required
    if: always()
    needs: [foundation, browser]
    runs-on: ubuntu-24.04
    steps:
      - name: Fail unless every required job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            [ "$result" = "success" ] || { echo "job result: $result"; exit 1; }
          done
