# Alembic configuration. The database URL comes from the environment (DATABASE_URL, the
# migration owner login), never from this file.
[alembic]
script_location = migrations
prepend_sys_path = src
path_separator = os
file_template = %%(rev)s_%%(slug)s
timezone = UTC
truncate_slug_length = 40

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
