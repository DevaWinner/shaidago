# Local and CI infrastructure for ShaidaGo. Development only: every port is bound to loopback,
# and every credential is required from the environment (see .env.example) rather than defaulted.
# Images are pinned by digest; bump them in a reviewed change.
name: shaidago


services:
  postgres:
    # PostgreSQL 18 with pgvector.
    image: pgvector/pgvector:pg18@sha256:2ba9ca5f2e7daa0f0e7723cba1ee9167bab54efd3640516a44ac1a928dd67e7a
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      - "${INFRA_BIND_ADDRESS:-127.0.0.1}:${INFRA_POSTGRES_PORT:-55432}:5432"
    volumes:
      # PostgreSQL 18 images keep versioned data directories under /var/lib/postgresql.
      - postgres_data:/var/lib/postgresql
    shm_size: 256mb
    mem_limit: 1g
    healthcheck:
      # TCP on 127.0.0.1: the temporary initdb server listens only on the socket, so this is
      # not ready until the real server is.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:8-alpine@sha256:bd999b5cfee25fb24b8320a31fddbd69f462df44c8138c66e369582937beebc0
    # Append-only file so queued local jobs survive a restart; bounded memory, no eviction of
    # queue data.
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - noeviction
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    ports:
      - "${INFRA_BIND_ADDRESS:-127.0.0.1}:${INFRA_REDIS_PORT:-56379}:6379"
    volumes:
      - redis_data:/data
    mem_limit: 384m
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio:
    # Community MinIO from Quay (no longer published to Docker Hub). Local development only;
    # hosted environments use Cloudflare R2.
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORE_ACCESS_KEY_ID:?set OBJECT_STORE_ACCESS_KEY_ID in .env}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORE_SECRET_ACCESS_KEY:?set OBJECT_STORE_SECRET_ACCESS_KEY in .env}
    ports:
      - "${INFRA_BIND_ADDRESS:-127.0.0.1}:${INFRA_MINIO_PORT:-59000}:9000"
      - "${INFRA_BIND_ADDRESS:-127.0.0.1}:${INFRA_MINIO_CONSOLE_PORT:-59001}:9001"
    volumes:
      - minio_data:/data
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  minio-init:
    # One-shot provisioner: creates the private evidence bucket and asserts it is not anonymous.
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORE_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORE_SECRET_ACCESS_KEY}
      EVIDENCE_BUCKET: ${OBJECT_STORE_BUCKET:?set OBJECT_STORE_BUCKET in .env}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "local/$$EVIDENCE_BUCKET"
        mc anonymous set none "local/$$EVIDENCE_BUCKET"
        mc version enable "local/$$EVIDENCE_BUCKET" >/dev/null 2>&1 || true
        echo "bucket $$EVIDENCE_BUCKET ready (anonymous access: $$(mc anonymous get "local/$$EVIDENCE_BUCKET"))"
    restart: "no"

  clamav:
    # Optional scanner (profile "scanner"); it needs about 1.5-3 GB of memory for signatures.
    # The Debian build is used because the Alpine image has no arm64 variant.
    image: clamav/clamav-debian:1.5@sha256:cc16781fe005e49de6a8fc1231b63b265f74b18fc2a6347c670c35716914c3b6
    profiles: ["scanner"]
    ports:
      - "${INFRA_BIND_ADDRESS:-127.0.0.1}:${INFRA_CLAMD_PORT:-53310}:3310"
    volumes:
      - clamav_db:/var/lib/clamav
    mem_limit: ${INFRA_CLAMAV_MEM_LIMIT:-2560m}
    healthcheck:
      # clamdcheck.sh pings clamd, which only answers once the signature database is loaded.
      test: ["CMD-SHELL", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 300s
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
  clamav_db:
